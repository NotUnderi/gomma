<!DOCTYPE html>
<html>

<head>
    <title>Gömma</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" crossorigin="anonymous"></script>
    <style>
        .selectall {
            user-select: all;
            -webkit-user-select: all;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a href="/" class="navbar-brand">Gömma</a>
        <ul class="navbar-nav mr-auto">
            <li class="nav-item mx-1"><a href="/gomma/" class="nav-link">Gömma</a></li>
        </ul>
    </nav>

    <div class="container mt-5">

        <div class="row">
            <div class="col-6">
                <div class="card">
                    <div class="card-header">Upload to Gömma</div>
                    <div class="card-body">
                        <form method="post" action="/gomma/" enctype="multipart/form-data">
                            <input type="hidden" name="csrfmiddlewaretoken" value="G9peoY7Ttlh3x1G2UuTh6PvRT4JhRfnTWmiYlqVhHiKUsX6ebOEMAdbvpde7Dv3i">
                            <div class="custom-file mb-3">
                                <input type="file" id="fileinput" multiple name="file[]" onchange="updateFileField()" class="btn custom-file-input">
                                <label class="custom-file-label" id="filesdesc">Choose files to upload</label>
                            </div>
                            <div class="form-group">
                                <label>Name:</label>
                                <input type="text" name="name" placeholder="[Leave empty for random]" class="form-control" minlength="1" maxlength="32">
                                <small class="form-text text-muted">
                                <b>3-32 characters</b>, it will be part of the shortened link ( <b>localhost/gomma/[namehere]</b> )
                            </small>
                            </div>
                            <input type="submit" name="upload" value="Upload" class="btn btn-success btn-block my-3">
                        </form>
                         
                        
                        
                    </div>
                </div>
            </div>

            
            <div class="col-5">
			<div class="row">
				<div class="col-12">
					<div class="card">
						<div class="card-body">
							<p>Uploads: <b>0</b></p>
                            <p>Data stored: <b>0 bytes</b></p>
						</div>
					</div>
				</div>
			</div>

            
			<div class="row mt-3 mb-5">
				<div class="col-12">
					<div class="card">
						<table class="table">
							<thead>
								<tr>
									<th scope="col">Your recent uploads</th>
									<th scope="col">Size</th>
								</tr>
							</thead>
							<tbody>
							
							</tbody>
						</table>
					</div>
				</div>
			</div>
        </div>

            <script>
                function updateFileField(){
                    var numFiles = $("#fileinput").prop("files").length;
                    if(numFiles == 1){
                        $("#filesdesc").html($("#fileinput").val().split('\\').pop());
                    } else{
                        $("#filesdesc").html(numFiles+" files selected");
                    }
                }
            </script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
            <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.6/clipboard.min.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.6/clipboard.min.js"></script>
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
                    var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
                        return new bootstrap.Tooltip(tooltipTriggerEl)
                    })
                
                    // ClipboardJS
                    var clipboard = new ClipboardJS('.copy-btn');
                
                    $(function () {
                    $('[data-toggle="tooltip"]').tooltip();
                    });
                
                    $('.copy-btn').click(function() {
                    var $btn = $(this);
                    $btn.tooltip('hide')
                        .attr('data-original-title', 'Copied!') // change text
                        .tooltip('show');
                
                    setTimeout(function() {
                        $btn.tooltip('hide')
                            .attr('data-original-title', 'Copy link');
                    }, 3000);
                    });
                });
            </script>
</body>

</html>
